[project]
name = "hgumba-middleware"
version = "1.0.0"
description = "Middleware de integração entre SENAITE LIS e Sistemas do Exército (SANDRA, SIRE, CADBEN)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.47.0",
    "slowapi>=0.1.9",
]

[project.scripts]
instrumentos = "instruments.runner:main"
gateway = "main:app"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
